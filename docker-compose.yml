services:
  media:
    build:
      context: .
      dockerfile: media-worker/Dockerfile
    environment:
      PORT: "8788"
      DATA_DIR: /data/jobs
      APP_ORIGIN: http://host.docker.internal:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./.media-data:/data
